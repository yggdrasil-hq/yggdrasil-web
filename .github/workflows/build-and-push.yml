name: Build and push image

# Pushes the prod image to GitHub Container Registry so deploys can pull a
# pinned tag instead of building on the host. See ../../docs/conventions/deploy.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skipped on pull_request: fork PRs get a read-only GITHUB_TOKEN, and
      # the build never pushes on pull_request, so there's nothing to
      # authenticate for.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: vars
        run: echo "sha_tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build image
        # NEXT_PUBLIC_API_BASE_URL/NEXT_PUBLIC_BASE_PATH are inlined into the
        # client bundle at build time (see deploy/Dockerfile.prod), so they
        # must be passed as build args here, not left to runtime env. Set
        # these as repo/org Actions variables (Settings > Secrets and
        # variables > Actions > Variables).
        run: |
          docker build -f deploy/Dockerfile.prod \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ vars.NEXT_PUBLIC_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_BASE_PATH="${{ vars.NEXT_PUBLIC_BASE_PATH }}" \
            -t "$IMAGE:${{ steps.vars.outputs.sha_tag }}" \
            -t "$IMAGE:latest" \
            .

      # PRs stop here (build validation only) — nothing below runs.
      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ steps.vars.outputs.sha_tag }}"
          docker push "$IMAGE:latest"
